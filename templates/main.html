<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignBridge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>

    <div class="main-container">
        <div class="camera-box" id="camera-box">
            <div class="top-bar">
                <div class="status-badge">
                    <div id="status-dot" class="dot"></div>
                    <span id="status-text">System Standby</span>
                </div>
                
                <button id="fullscreen-btn" class="icon-btn" title="Toggle Fullscreen">
                    <i id="fullscreen-icon" class="bi bi-fullscreen"></i>
                </button>
            </div>

            <video id="video-feed" autoplay playsinline></video>
            <canvas id="canvas-overlay"></canvas>
            
            <div class="subtitle-area">
                <div id="output-text">Ready to translate...</div>
            </div>

            <div class="control-panel" id="control-panel">
                <button id="start-btn" class="btn-main btn-start">Start Recognition</button>
                <button id="stop-btn" class="btn-main btn-stop" disabled>Stop</button>
                <label for="video-upload" class="upload-btn">
                    Upload video file
                    <input type="file" id="video-upload" hidden accept="video/*">
                </label>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
